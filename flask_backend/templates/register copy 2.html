{% extends "base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <!-- <div class="auth-icon">🚀</div> -->

            <h1>Create Your Account</h1>

            <p>Join K-DISC and start sharing your ideas</p>

        </div>

        <form method="POST" action="/register">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    class="auth-input"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="auth-input"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="auth-input"
                    placeholder="Create a password"
                    required
                >

            </div>

            <button type="submit" class="create-account-btn">
                Create Account
            </button>

        </form>

        <div class="auth-footer">

            <p>Already a member of K-DISC?</p>

            <a href="/login" class="login-btn">
                Login
            </a>

        </div>

    </div>

</div>

<style>

.auth-page {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 20px;
    background: linear-gradient(
        135deg,
        #f8fbfa 0%,
        #eef7f5 100%
    );
}

.auth-card {
    width: 100%;
    max-width: 560px;
    background: #ffffff;
    padding: 22px 45px;
    border: 1px solid #e2ece9;
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(0, 80, 70, 0.08);
}

.auth-header {
    text-align: center;
    margin-bottom: 20px;
}

.auth-icon {
    font-size: 30px;
    margin-bottom: 2px;
}

.auth-header h1 {
    font-family: Georgia, serif;
    color: #10243e;
    font-size: 32px;
    font-weight: 700;
    margin: 5px 0;
}

.auth-header p {
    color: #64748b;
    font-size: 16px;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    color: #10243e;
    font-weight: 600;
    margin-bottom: 5px;
}

.auth-input {
    width: 100%;
    padding: 11px 15px;
    height: 48px;
    border: 1px solid #d7e3e0;
    border-radius: 10px;
    font-size: 15px;
    background: #fbfdfc;
    transition: 0.2s;
}

.auth-input:focus {
    outline: none;
    border-color: #13877c;
    box-shadow: 0 0 0 3px rgba(19, 135, 124, 0.12);
    background: white;
}

.create-account-btn {
    width: 100%;
    margin-top: 5px;
    padding: 12px;
    border: none;
    border-radius: 30px;
    background: #13877c;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.create-account-btn:hover {
    background: #0f7168;
}

.auth-footer {
    text-align: center;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid #e7eeee;
}

.auth-footer p {
    color: #64748b;
    margin-bottom: 8px;
}

.login-btn {
    display: inline-block;
    padding: 8px 26px;
    border: 1.5px solid #13877c;
    border-radius: 25px;
    color: #13877c;
    text-decoration: none;
    font-weight: 600;
}

.login-btn:hover {
    background: #13877c;
    color: white;
}

</style>

{% endblock %}
