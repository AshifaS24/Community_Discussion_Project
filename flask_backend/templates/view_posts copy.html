<!DOCTYPE html>
<html>
<head>
    
    <title>All Discussions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h1>All Discussions</h1>
    <form method="GET" class="mb-3">
    <input type="text"
           name="search"
           class="form-control"
           placeholder="Search discussions">
    <br>

    <input type="submit"
           value="Search"
           class="btn btn-primary">
</form>

<hr>

    {% for post in posts %}

  <div class="card mb-3">
    <div class="card-body">

        <h3 class="card-title">
            <a href="/discussion/{{ post[0] }}">
                {{ post[1] }}
            </a>
        </h3>
        <p>👍 Likes: {{ post[4] }}</p>
        <p>📌 Status: {{ post[5] }}</p>
        <a href="/like/{{ post[0] }}"
        class="btn btn-primary btn-sm">
        👍 Like
        </a>
        <a href="/recommend/{{ post[0] }}"
        class="btn btn-info btn-sm">
        🤖 Recommend
        </a>

       {% if post[3] == current_user %}

    <a href="/edit_post/{{ post[0] }}"
    class="btn btn-warning btn-sm">
     Edit
    </a>
    <a href="/bookmark/{{ post[0] }}"
    class="btn btn-info btn-sm">
    ⭐ Save
    </a>

    <a href="/delete_post/{{ post[0] }}"
    class="btn btn-danger btn-sm">
    Delete
    </a>
    <a href="/solve/{{ post[0] }}"
    class="btn btn-success btn-sm">
    ✅ Solved
    </a>
    <a href="/summary/{{ post[0] }}"
    class="btn btn-info btn-sm">
    AI Summary
    </a>
    <a href="/sentiment/{{ post[0] }}"
    class="btn btn-success btn-sm">
    Sentiment
    </a>

    {% endif %}

        <p class="card-text">
            {{ post[2] }}
        </p>

    </div>
</div>

    {% endfor %}

</body>
</html>
