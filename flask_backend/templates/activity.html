{% extends "base.html" %}

{% block content %}

<style>

/* =========================================================
   K-DISC — MODERN ACTIVITY PAGE
========================================================= */

.activity-page {
    width: 100%;
    min-height: calc(100vh - 130px);

    padding: 40px 55px 60px;

    background:
        radial-gradient(
            circle at 8% 10%,
            rgba(20, 180, 165, 0.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 92% 15%,
            rgba(80, 100, 180, 0.08),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f5faf9,
            #f7f9fc,
            #f5f6fb
        );
}


/* =========================================================
   HEADER
========================================================= */

.activity-header {
    max-width: 1250px;
    margin: 0 auto 28px;
}

.activity-header h1 {
    margin: 0;

    color: #17344f;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 36px;

    font-weight: 500;

    letter-spacing: -0.5px;
}

.activity-header h1 span {
    color: #079d91;
}

.activity-header p {
    margin: 9px 0 0;

    color: #7a8d9c;

    font-size: 14px;
}


/* =========================================================
   ACTIVITY CONTAINER
========================================================= */

.activity-container {
    max-width: 1250px;
    margin: 0 auto;

    padding: 28px;

    border-radius: 25px;

    background:
        rgba(255,255,255,0.92);

    border: 1px solid #dfe9eb;

    box-shadow:
        0 20px 45px rgba(25,55,72,0.08),
        inset 0 1px 0 rgba(255,255,255,0.95);
}


/* =========================================================
   ACTIVITY LIST
========================================================= */

.activity-list {
    display: flex;

    flex-direction: column;

    gap: 12px;
}


/* =========================================================
   ACTIVITY ITEM
========================================================= */

.activity-item {
    position: relative;

    display: flex;

    align-items: center;

    gap: 17px;

    min-height: 76px;

    padding: 16px 20px;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #f9fcfc,
            #f3f7f8
        );

    border: 1px solid #e5edef;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}


.activity-item:hover {
    transform: translateX(5px);

    background: #ffffff;

    box-shadow:
        0 12px 28px rgba(27,57,74,0.09);
}


/* =========================================================
   ACTIVITY DOT
========================================================= */

.activity-dot {
    position: relative;

    flex-shrink: 0;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #10a99c;

    box-shadow:
        0 0 0 6px rgba(16,169,156,0.10),
        0 5px 12px rgba(16,169,156,0.25);
}


/* =========================================================
   ACTIVITY BODY
========================================================= */

.activity-body {
    min-width: 0;
}

.activity-label {
    display: block;

    margin-bottom: 4px;

    color: #079d91;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1.2px;

    text-transform: uppercase;
}

.activity-text {
    margin: 0;

    color: #304b61;

    font-size: 14px;

    font-weight: 600;

    line-height: 1.5;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    min-height: 240px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #f7fafb,
            #f2f7f8
        );

    border: 1px dashed #d6e2e5;
}

.empty-state::before {
    content: "◷";

    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 15px;

    border-radius: 18px;

    color: #079d91;

    background: #e6f8f5;

    font-size: 27px;

    box-shadow:
        0 10px 20px rgba(15,150,135,0.10);
}

.empty-state p {
    margin: 0;

    color: #7b8d9b;

    font-size: 14px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .activity-page {
        padding: 25px 18px 40px;
    }

    .activity-header h1 {
        font-size: 30px;
    }

    .activity-container {
        padding: 18px;
    }

    .activity-item {
        padding: 14px;
    }

}

</style>


<div class="activity-page">


    <!-- HEADER -->

    <div class="activity-header">

        <h1>
            Recent <span>Activity</span>
        </h1>

        <p>
            Latest actions performed by community members
        </p>

    </div>


    <!-- ACTIVITY -->

    <div class="activity-container">

        {% if activities %}

            <div class="activity-list">

                {% for item in activities %}

                    <div class="activity-item">

                        <span class="activity-dot"></span>

                        <div class="activity-body">

                            <span class="activity-label">
                                Community Activity
                            </span>

                            <p class="activity-text">
                                {{ item[1] }}
                            </p>

                        </div>

                    </div>

                {% endfor %}

            </div>

        {% else %}

            <div class="empty-state">

                <p>
                    No recent activity found.
                </p>

            </div>

        {% endif %}

    </div>

</div>

{% endblock %}
