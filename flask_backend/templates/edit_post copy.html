<!DOCTYPE html>
<html>
<head>
    <title>Edit Discussion</title>
</head>
<body>

    <h1>Edit Discussion</h1>

    <form method="POST">

        <label>Title:</label><br>
        <input type="text" name="title" value="{{ post[1] }}"><br><br>

        <label>Content:</label><br>
        <textarea name="content" rows="5" cols="40">{{ post[2] }}</textarea><br><br>

        <input type="submit" value="Update Discussion">

    </form>

</body>
</html>
