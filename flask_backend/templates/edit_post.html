{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1 class="page-title">Edit Discussion</h1>
    <p class="page-subtitle">Modify the title or content of your discussion</p>
</div>

<div class="create-layout">

    <div class="card-custom form-card">

        <h3 class="section-title">Update Your Discussion</h3>

        <p class="form-intro">
            Modify the title or content of your discussion.
        </p>

        <hr>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Discussion Title</label>

                <input
                    type="text"
                    name="title"
                    value="{{ post[1] }}"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">Discussion Content</label>

                <textarea
                    name="content"
                    rows="8"
                    class="form-control"
                    required>{{ post[2] }}</textarea>

            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary btn-lg">
                    Update Discussion
                </button>

                <a href="/view_posts" class="btn btn-outline-primary btn-lg">
                    Cancel
                </a>

            </div>

        </form>

    </div>

    <div class="create-illustration">
        <svg viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg">

            <circle cx="160" cy="200" r="150" fill="#F2994A" opacity="0.05"/>

            <g transform="translate(80,80)">
                <rect x="0" y="0" width="140" height="180" rx="10"
                      fill="#FFFFFF" stroke="#0F7A6E" stroke-width="2.5"/>
                <line x1="20" y1="35" x2="120" y2="35" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="58" x2="120" y2="58" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="81" x2="90" y2="81" stroke="#F2994A" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="104" x2="110" y2="104" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
                <line x1="20" y1="127" x2="95" y2="127" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
            </g>

            <g transform="translate(195,145) rotate(-25)">
                <rect x="0" y="0" width="14" height="70" rx="4" fill="#0F7A6E"/>
                <polygon points="0,70 14,70 7,86" fill="#D4A017"/>
                <rect x="-2" y="-8" width="18" height="12" rx="3" fill="#1B2A4A"/>
            </g>

            <g fill="#F2994A" opacity="0.8">
                <circle cx="60" cy="290" r="6"/>
                <circle cx="85" cy="310" r="4"/>
            </g>

            <g fill="#0F7A6E" opacity="0.7">
                <circle cx="250" cy="270" r="6"/>
                <circle cx="230" cy="300" r="4"/>
            </g>

            <g stroke="#0F7A6E" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.4" fill="none">
                <path d="M65 295 Q110 320 150 290"/>
            </g>

        </svg>

        <p class="illustration-caption">Refine your idea until it's just right.</p>

    </div>

</div>

{% endblock %}
