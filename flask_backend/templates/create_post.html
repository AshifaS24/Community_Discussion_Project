{% extends "base.html" %}

{% block content %}
<style>

/* =========================================================
   K-DISC — PROFESSIONAL CREATE DISCUSSION PAGE
========================================================= */

.create-page {
    min-height: calc(100vh - 130px);
    padding: 55px 7vw 70px;
    background:
        radial-gradient(circle at 8% 15%, rgba(20, 184, 166, 0.12), transparent 28%),
        radial-gradient(circle at 92% 20%, rgba(79, 70, 229, 0.10), transparent 30%),
        linear-gradient(135deg, #f7fbfb 0%, #f5f8fc 50%, #f8f7ff 100%);
}

/* HEADER */

.create-header {
    max-width: 1150px;
    margin: 0 auto 32px;
}

.create-kicker {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    color: #0f8f84;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;

    margin-bottom: 10px;
}

.create-kicker::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #16b8a7;
    box-shadow: 0 0 0 6px rgba(22,184,167,.10);
}

.create-header h1 {
    margin: 0;
    color: #142b45;
    font-family: Georgia, serif;
    font-size: clamp(34px, 4vw, 52px);
    font-weight: 600;
    letter-spacing: -1.5px;
}

.create-header h1 span {
    color: #0f9b8e;
}

.create-header p {
    margin: 10px 0 0;
    color: #6b7f95;
    font-size: 16px;
}

/* MAIN 3D LAYOUT */

.create-workspace {
    max-width: 1150px;
    margin: auto;

    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr);
    gap: 30px;
    align-items: stretch;
}

/* FORM CARD */

.form-card {
    position: relative;

    padding: 38px 42px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.98),
            rgba(247,251,251,.94)
        );

    border: 1px solid rgba(255,255,255,.9);

    box-shadow:
        0 30px 70px rgba(28,55,75,.12),
        0 8px 20px rgba(28,55,75,.06);

    transform: translateY(0);
    transition: .3s ease;
}

.form-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 35px 80px rgba(28,55,75,.15),
        0 12px 25px rgba(28,55,75,.08);
}

.form-card::before {
    content: "";

    position: absolute;
    top: 0;
    left: 35px;
    right: 35px;

    height: 3px;

    border-radius: 0 0 10px 10px;

    background: linear-gradient(
        90deg,
        #0f9f92,
        #24c7b5,
        #7c83f5
    );
}

/* FORM TITLE */

.form-card .section-title {
    margin: 0;

    color: #172f49;

    font-family: Georgia, serif;

    font-size: 25px;
    font-weight: 600;
}

.form-intro {
    margin: 8px 0 22px;

    color: #71849a;

    font-size: 14px;
    line-height: 1.6;
}

.form-card hr {
    border: 0;
    border-top: 1px solid #e5ebef;

    margin: 0 0 26px;
}

/* LABELS */

.form-label {
    color: #23384f !important;

    font-size: 13px !important;
    font-weight: 700 !important;

    margin-bottom: 8px;
}

/* INPUTS */

.form-card .form-control {
    min-height: 50px;

    border-radius: 12px;

    border: 1px solid #dce5ea;

    background: #fbfdfd;

    padding: 13px 15px;

    color: #23384f;

    font-size: 14px;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,.02);

    transition: all .25s ease;
}

.form-card textarea.form-control {
    min-height: 190px;
    resize: vertical;
}

.form-card .form-control::placeholder {
    color: #aab5bf;
}

.form-card .form-control:focus {
    border-color: #16a99b;

    background: #ffffff;

    outline: none;

    box-shadow:
        0 0 0 4px rgba(22,169,155,.10),
        0 8px 20px rgba(22,169,155,.06);
}

/* CREATE BUTTON */

.form-card .btn-primary {
    border: 0;

    border-radius: 12px;

    padding: 13px 25px;

    background: linear-gradient(
        135deg,
        #0f9f92,
        #087d76
    );

    color: white;

    font-size: 14px;
    font-weight: 700;

    box-shadow:
        0 10px 22px rgba(15,159,146,.25);

    transition: all .25s ease;
}

.form-card .btn-primary:hover {
    transform: translateY(-2px);

    background: linear-gradient(
        135deg,
        #12aa9c,
        #08746e
    );

    box-shadow:
        0 14px 28px rgba(15,159,146,.32);
}

/* =========================================================
   RIGHT 3D VISUAL PANEL
========================================================= */

.create-illustration {
    position: relative;

    min-height: 500px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 26px;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(15,159,146,.13),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            rgba(255,255,255,.65),
            rgba(239,245,250,.45)
        );

    border: 1px solid rgba(255,255,255,.85);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.9),
        0 25px 60px rgba(28,55,75,.08);
}

.create-illustration::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(15,159,146,.06);

    filter: blur(2px);
}

.create-illustration svg {
    position: relative;
    z-index: 2;

    width: min(330px, 80%);

    filter:
        drop-shadow(0 25px 25px rgba(22,54,70,.15));

    animation: floatingIllustration 4s ease-in-out infinite;
}

@keyframes floatingIllustration {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

.illustration-caption {
    position: relative;
    z-index: 2;

    margin: 8px 25px 0;

    color: #667b90;

    font-family: Georgia, serif;

    font-size: 15px;

    font-style: italic;

    text-align: center;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .create-page {
        padding: 35px 25px 50px;
    }

    .create-workspace {
        grid-template-columns: 1fr;
    }

    .create-illustration {
        min-height: 350px;
    }

}

@media (max-width: 600px) {

    .create-page {
        padding: 25px 16px 40px;
    }

    .form-card {
        padding: 28px 22px;
    }

    .create-header h1 {
        font-size: 36px;
    }

}

</style>

<div class="page-header">
    <h1 class="page-title">Create New Discussion</h1>
    <p class="page-subtitle">Start a new conversation with the community</p>
</div>

<div class="create-layout">

    <div class="card-custom form-card">

        <h3 class="section-title">Share Your Ideas With The Community</h3>

        <p class="form-intro">
            Create a discussion topic and start a conversation with other members.
        </p>

        <hr>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Discussion Title</label>

                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter discussion title"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">Discussion Content</label>

                <textarea
                    name="content"
                    rows="8"
                    class="form-control"
                    placeholder="Write your discussion here..."
                    required></textarea>

            </div>

            <button type="submit" class="btn btn-primary btn-lg">
                Create Discussion
            </button>

        </form>

    </div>

    <div class="create-illustration">
        <svg viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg">

            <circle cx="160" cy="200" r="150" fill="#0F7A6E" opacity="0.05"/>

            <g transform="translate(60,90)">
                <path d="M0 20 a20 20 0 0 1 20 -20 h140 a20 20 0 0 1 20 20 v90 a20 20 0 0 1 -20 20 h-95 l-35 35 v-35 h-10 a20 20 0 0 1 -20 -20 z"
                      fill="#FFFFFF" stroke="#0F7A6E" stroke-width="2.5"/>
                <line x1="25" y1="45" x2="155" y2="45" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
                <line x1="25" y1="65" x2="155" y2="65" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
                <line x1="25" y1="85" x2="100" y2="85" stroke="#E7ECEC" stroke-width="3" stroke-linecap="round"/>
            </g>

            <g transform="translate(210,60) rotate(20)">
                <rect x="0" y="0" width="14" height="70" rx="4" fill="#F2994A"/>
                <polygon points="0,70 14,70 7,86" fill="#D4A017"/>
                <rect x="-2" y="-8" width="18" height="12" rx="3" fill="#1B2A4A"/>
            </g>

            <g fill="#F2994A" opacity="0.85">
                <circle cx="55" cy="260" r="7"/>
                <circle cx="80" cy="285" r="5"/>
                <circle cx="45" cy="300" r="4"/>
            </g>

            <g fill="#0F7A6E" opacity="0.7">
                <circle cx="250" cy="220" r="6"/>
                <circle cx="270" cy="250" r="4"/>
            </g>

            <g stroke="#0F7A6E" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.4" fill="none">
                <path d="M60 265 Q90 300 130 260"/>
                <path d="M245 225 Q220 260 190 235"/>
            </g>

        </svg>

        <p class="illustration-caption">Every great conversation starts with one idea.</p>

    </div>

</div>

{% endblock %}
